*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:17px/1.5 var(--font);-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--green)}
a{color:var(--blue)}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--tan);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--green);color:var(--green-ink);box-shadow:0 1px 0 rgba(0,0,0,.15)}
header.top .wrap{padding-block:10px 12px;display:grid;grid-template-columns:minmax(0,1fr);gap:8px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand img{width:30px;height:48px;object-fit:contain;border-radius:3px;background:#F4EFE2}
.brand>div{min-width:0;flex:1}
.brand b{font-size:17px;letter-spacing:.01em;display:block}
.brand small{display:block;font-size:11px;opacity:.85;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.status{flex-shrink:0;font-size:12px;padding:3px 8px;border-radius:99px;background:rgba(255,255,255,.16);white-space:nowrap}
.search{display:flex;gap:8px}
.search input{flex:1;min-width:0;font:inherit;font-size:18px;padding:12px 14px;border-radius:10px;border:0;background:var(--surface);color:var(--ink)}
.search button{flex-shrink:0;border:0;border-radius:10px;padding:0 16px;background:var(--tan);color:#2A1E0C;font-weight:700}

main{padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
main .wrap{padding-block:16px 24px;display:grid;gap:16px}
h1,h2,h3{text-wrap:balance;line-height:1.25;margin:0}
h1{font-size:22px;color:var(--green)}
h2{font-size:19px;color:var(--green)}
h3{font-size:16px}
p{margin:0}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--bronze);font-weight:700}
.muted{color:var(--muted)}
.small{font-size:14px}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:8px 14px;font-size:15px;cursor:pointer}
.chip:active{background:var(--tan-soft)}

.result{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:grid;gap:8px;min-width:0}
.result .where{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.result .where button{border:0;background:none;color:var(--blue);text-decoration:underline;padding:0;font-size:13px;cursor:pointer}
.tag{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:2px 7px;border-radius:5px}
.tag.std{background:var(--tan-soft);color:var(--bronze)}
.tag.def{background:var(--blue-soft);color:var(--blue)}
mark{background:var(--hit);color:inherit;border-radius:3px;padding:0 1px}
.result ul,.sec ul,.sec ol{margin:0;padding-left:22px;display:grid;gap:4px}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:16px}

.std{border-left:4px solid var(--tan);background:var(--tan-soft);padding:10px 12px;border-radius:0 8px 8px 0}
.std .lab{display:block;font-size:11px;font-weight:800;letter-spacing:.1em;color:var(--bronze);margin-bottom:2px}
.cite{font-size:13px;font-style:italic;color:var(--muted)}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.tbl table{border-collapse:collapse;width:100%;font-size:14px}
.tbl.wide table{min-width:560px}
.tbl th{background:var(--green);color:var(--green-ink);text-align:left;padding:7px 8px;font-weight:700;font-size:13px}
.tbl td{padding:7px 8px;border-top:1px solid var(--line);vertical-align:top}
.tbl tr:nth-child(even) td{background:var(--bg)}
.fig{display:block;border:1px solid var(--line);border-radius:8px;background:#fff;padding:0;cursor:zoom-in;width:100%}
.fig img{display:block;width:100%;height:auto;border-radius:8px}

.sec{display:grid;gap:12px}
.toc{display:grid;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px}
.toc button{display:flex;justify-content:space-between;gap:10px;text-align:left;border:0;background:none;padding:11px 10px;border-radius:8px;cursor:pointer;font-size:16px}

.toc button:active{background:var(--tan-soft)}
.back{justify-self:start;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 12px;cursor:pointer}
.gloss{display:grid;gap:8px}
.gloss div{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 12px}

.cards{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.card{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;cursor:pointer;display:grid;gap:4px}
.card b{color:var(--green);font-size:17px}
.card span{font-size:14px;color:var(--muted)}

.wk{display:grid;gap:14px}
.trail{display:flex;flex-wrap:wrap;gap:6px;font-size:13px}
.trail span{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:3px 8px;color:var(--muted)}
.q{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:grid;gap:12px}
.q h2{color:var(--ink)}
.q ul{margin:0;padding-left:22px;display:grid;gap:6px}
.opts{display:grid;gap:10px}
.opt{border:2px solid var(--green);background:var(--surface);color:var(--green);border-radius:10px;padding:14px;font-weight:700;font-size:17px;cursor:pointer;text-align:left}
.opt:active{background:var(--green);color:var(--green-ink)}
.answer{border-radius:12px;padding:16px;display:grid;gap:10px;border:2px solid}
.answer .code{font-size:26px;font-weight:800;letter-spacing:.01em}
.answer.red{background:var(--red-soft);border-color:var(--red)} .answer.red .code{color:var(--red)}
.answer.amber{background:var(--amber-soft);border-color:var(--amber)} .answer.amber .code{color:var(--amber)}
.answer.ok{background:var(--ok-soft);border-color:var(--ok)} .answer.ok .code{color:var(--ok)}
.answer.blue{background:var(--blue-soft);border-color:var(--blue)} .answer.blue .code{color:var(--blue)}
.answer ul{margin:0;padding-left:22px;display:grid;gap:4px}
.row{display:flex;gap:10px;flex-wrap:wrap}

nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .wrap{display:grid;grid-template-columns:repeat(4,1fr)}
nav.tabs button{border:0;background:none;padding:10px 4px 12px;font-size:13px;font-weight:600;color:var(--muted);display:grid;justify-items:center;gap:3px;cursor:pointer}
nav.tabs button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button[aria-current="page"]{color:var(--green)}

.zoom{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.88);overflow:auto;padding:calc(56px + env(safe-area-inset-top,0px)) max(8px,env(safe-area-inset-right,0px)) 24px max(8px,env(safe-area-inset-left,0px))}
.zoom img{display:block;width:100%;max-width:none;background:#fff;border-radius:6px}
.zoom.big img{width:200%}
.zoom .bar{position:fixed;top:calc(8px + env(safe-area-inset-top,0px));right:calc(8px + env(safe-area-inset-right,0px));display:flex;gap:8px}
.zoom .bar button{border:0;border-radius:8px;padding:10px 14px;background:#fff;color:#111;font-weight:700}
footer.note{font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:12px}
@media (prefers-reduced-motion: reduce){*{scroll-behavior:auto!important}}

{
"t": "p",
"x": "**Outlet drop**: a vertical drop from the culvert outlet to the water surface or streambed below. Any outlet drop is a potential fish passage barrier. It is the first of the four barrier questions.  ODF FRIA Fish Passage Assessment Flowchart"
},
{
"t": "p",
"x": "**Diversion potential**: exists when the capacity of a water crossing may not accommodate high flows, causing the stream to back up behind the fill and flow down the road. Water crossings must be designed and constructed so streamflow is not likely to be diverted out of the channel if the crossing fails. Where a stream can flow over the road and back into the channel, diversion potential is low. Diversion potential is **high on roads with long climbing sections or numerous stream crossings**.  OAR 629-625-0320(1)(g)"
},
{
"t": "std",
"x": "We are not quantifying diversion potential. If a stream is actively diverting, record **yes** and use the Road Notes point layer to GPS where it is being diverted to and from."
},
{
"t": "p",
"x": "**Hydrologic connectivity**: the degree to which the road prism routes water to a crossing or relief culvert rather than dispersing it. Water crossings must minimize hydrologic connectivity for the adjacent roadway. The total length of road with potential to drain to waters of the state is the **distance connected**; road length using best management practices to minimize that is the **distance disconnect**. Disconnection points include cross drains, water bars, grade reversals and crests.  OAR 629-625-0320(1)(d)"
},
{
"t": "p",
"x": "**Hydrologic disconnection**: the removal of direct routes of drainage or overland flow of road runoff to waters of the state.  OAR 629-600-0100"
},
{
"t": "std",
"x": "A stream pipe is hydrologically **disconnected** if any one of the following is true:"
},
{
"t": "li",
"x": "On the uphill side(s) of the pipe, there is a cross drain, another stream culvert, or both sides of the road are ditched out within 300 ft.",
"num": false
},
{
"t": "li",
"x": "On the uphill side(s) of the pipe, there is a natural drainage break, such as a crest, within 300 ft.",
"num": false
},
{
"t": "li",
"x": "On the uphill side(s) of the pipe, there are sediment traps or settling ponds in the ditchline.",
"num": false
},
{
"t": "li",
"x": "For deep fills, the slope distance between the ditch and the actual stream channel is greater than 30 ft. However, if there is visible scour from the ditchline to the stream, no matter the distance, the pipe is connected.",
"num": false
},
{
"t": "li",
"x": "For dirt surface roads, on the uphill side(s) of the pipe, there is a functional waterbar within 50 ft. If a ditch is present, waterbars must be keyed into the ditch to be considered functional.",
"num": false
},
{
"t": "li",
"x": "The road is undrivable and well vegetated with grass or brush.",
"num": false
},
{
"t": "p",
"x": "If the pipe is in a sag and one side of the sag is disconnected but the other is not, the pipe is connected. See Appendix D for the twelve cases worked through."
},
{
"t": "p",
"x": "**Plug potential**: the likelihood that woody material, sediment or debris will block the culvert. Woody material is more likely to plug a culvert that has a wide basin at the inlet relative to the pipe diameter. Assess site inputs (downed logs, woody debris, sediment sources) and whether the structure can pass them.  ODF FRIA Technical Guidance; OAR 629-625-0320(1)(c)"
},
{
"t": "std",
"x": "**InletOutlet_Condition.** Lots of things could be considered potential inputs for plugging. For this inventory, use that option only where there is a significant wad of debris within roughly 20 ft upstream of the pipe. A log wedged into both streambanks does not count, a half-submerged boulder does not count, a debris jam 100 ft up the hill does not count. **Do not use the Potential Sediment Deposits option.**"
},
{
"t": "p",
"x": "See Appendix E for worked examples of the 20 ft test."
},
{
"t": "p",
"x": "**Cross drain (relief** **culvert)**: A constructed feature across a road or in a ditch line, as a means of ditch relief, often before entering a stream channel. **Cross drains are not located in stream channels** and are considered elements of the road prism. Examples include culverts and water bars.  ODF FRIA Technical Guidance"
},
{
"t": "p",
"x": "**Field note:** because a cross drain is not in a stream channel, stream-related fields (slope, stream class, fish passage, active channel width, substrate, backwater) do not apply."
},
{
"t": "std",
"x": "Do not rely on the stream layer to decide whether a pipe is a culvert or a cross drain. **Look for a channel.** If there is a mapped stream but no channel actually exists at the road, call it a cross drain and note in the comments that there is no stream channel. In the reverse case, where you find a stream that is not mapped, call it a round, squash or box culvert as appropriate; no comment is necessary. If a pipe is carrying a spring (groundwater running out of the bank with no stream channel), enter it as a cross drain and note in the comments that it is a spring. Standing water in the ditch does not count as a spring."
},
{
"t": "std",
"x": "**Cross drains are relief culverts.** In this inventory a cross drain is a relief culvert. Do not record water bars as cross drains."
},
{
"t": "std",
"x": "**Structure type Other.** Puncheons and removed culverts already in the layer are coded Other, with puncheon or removed in the comments."
},
{
"t": "p",
"x": "See Appendix B for the six cases side by side."
},

"t": "std",
"x": "**Photos.** Photos are not necessary for every pipe. Use your discretion about whether one adds value. If a culvert inlet is 30% blocked, a photo tells us no more than the percent open field does, and there is no need to photograph a pipe in fully functioning condition. Photos help in atypical situations where visibility is good."
},
{
"t": "std",
"x": "**Diameter.** For squash pipes, where the span and rise match no dropdown option, choose the option whose **span** is closest and put the actual dimensions in the comments. If both ends are buried and you cannot measure the diameter, choose Other and note the situation."
},
{
"t": "std",
"x": "**Fill_height_ft.** Height is measured from the downstream road shoulder vertically to the pipe invert directly underneath the road shoulder. Unless the pipe is at zero percent slope you will not be able to determine that without running a profile, so it is acceptable to measure fill height from the downstream road shoulder to the outlet invert. For fills deeper than the top dropdown band, put the estimated height in the comments: deep fills set replacement priority."
},
{
"t": "std",
"x": "**Percent_open.** How much of the opening is **clear** of sediment or other blockages, recorded in five bands: 1\u201325%, 26\u201350%, 51\u201375%, 76\u201399% and 100%. A clear barrel is 100% open. Assess the inlet or the outlet, whichever is the most plugged, generally the inlet. If it is the outlet, note that in the comments."
},
{
"t": "std",
"x": "**Percent** **open is an area, not a depth.** A pipe three quarters full by depth is only about 20% open by area, because what is left is the narrow crescent at the top. A round culvert embedded to spec, 30\u201350% of height, reads 51\u201375% open. That is the design, not a defect, so note in Comments that the fill is natural bed material. There is no 0% band: a completely blocked, plugged, crushed or buried pipe is recorded 1\u201325% open with a Comment, and the status is CIRF."
},
{
"t": "p",
"x": "See Appendix C for the five bands, and what a properly embedded pipe reads."
},
{
"t": "std",
"x": "**Downspout.** Whether the pipe has a downspout: a pipe extension carrying outlet water down the fill to the channel. The field records whether one is **there**, not whether one is needed. If a pipe needs one, record no and put the need in Comments, or code Stream_Channel_Erosion as yes and let the engineer decide between armour rock and a downspout."
},

"x": "6. Road Assessment"
},
{
"t": "p",
"x": "**Road prism**: the constructed road cross-section: running surface, cut slope, fill slope and ditch. Cross drains are elements of the road prism.  ODF FRIA Technical Guidance"
},
{
"t": "p",
"x": "**High conservation value site**: an area where there is known hydrologic connectivity, chronic sedimentation, fish passage barriers, stream diversion or diversion potential. These sites currently contribute significant risk to aquatic resources at a scale beyond the immediate site, and resolving them delivers ecological benefit beyond the site itself.  OAR 629-625-0900(5)(a)"

"x": "**Conditions that indicate a road does not meet the FPA:**"

"num": false

"t": "p",
"x": "**When to assess:** the primary factor is where surface water flows, concentrates, or is redirected. It is good practice to assess roads during the wet season or after a storm event, so overland flow and road surface drainage can be observed. Dry-month assessments still detect sediment deposits."

{
"t": "h2",
"x": "6.1 Road classifications"
},
{
"t": "p",
"x": "Four mutually exclusive categories. The distinction carries regulatory weight: inventory and improvement obligations differ by class."
},
{
"t": "p",
"x": "**Active road**: a road currently being used or maintained for the purpose of removing commercial forest products.  OAR 629-600-0100"
},
{
"t": "p",
"x": "**Inactive road**: a road used for past forest management purposes exclusive of removing commercial forest products. Still in the management system, just not currently hauling or actively maintained.  OAR 629-600-0100"
},
{
"t": "p",
"x": "**Vacated road**: a road that has been made impassable and is no longer to be used for forest management purposes or commercial forest harvesting activities. Vacating must be done in compliance with OAR 629-625-0650: the road must actually be treated, not merely unused.  OAR 629-600-0100; OAR 629-625-0650"
},
{
"t": "p",
"x": "**Abandoned road**: a road constructed prior to 1972 that does not meet the criteria of active, inactive, or vacated. Does not include skid trails.  OAR 629-600-0100"
},
{
"t": "p",
"x": "**Forest road**: a running surface built or cleared on forestland for transportation of forest products and forest management activities. Includes all active, inactive, vacated and abandoned roads; excludes skid trails. Any road granting access to forestland is likely a forest road.  ODF FRIA Technical Guidance"
},
{
"t": "p",
"x": "**Field note:** the common error is calling an unused road \u201cvacated\u201d when it has simply not been driven. Vacated means treated and made impassable. If it has not been treated, it is inactive."
},
{
"t": "std",
"x": "The pre-1972 date in the abandoned-road definition is a records question, not a field test. Do not try to age a road on the ground. For non-vacated roads, call a drivable road **active** and an undrivable road **inactive**. A road that is coyoted in, or impassable because of a culvert blowout, is inactive. If merchantable trees are growing in the road prism, it is safe to call it **abandoned**. Do not spend field time agonizing over the distinction: when in doubt call it abandoned, and we will confirm or deny from aerial photos afterward."
},
{
"t": "h2",
"x": "6.2 Vacated is a documented event"
},
{
"t": "p",
"x": "A road is vacated only where **all four** of the following are true: all water crossing structures and fills were removed; natural channel connectivity and drainage were re-established; the road was effectively barricaded; and the vacating was notified to the State Forester in compliance with OAR 629-625-0650. A road that has not been vacated to that standard is an abandoned road."
},
{
"t": "cite",
"x": "ODF FRIA Technical Guidance, Table 1; OAR 629-625-0650"
},
{
"t": "std",
"x": "**Removed** **crossings are what make a road vacated. Do not run the test backwards.** An old road line crossing a stream on the map tells you nothing about whether the crossing is still there. Unless the office confirms a vacating notification on file, treat the road as inactive or abandoned and treat its crossings as unknown."
},
{
"t": "std",
"x": "Where you cannot reach a crossing, leave the culvert status as Unknown with a comment saying why: no access, buried, could not locate. The crossing stays on the work matrix. Undetermined is reserved for the cases in Section 2. Never record a crossing as removed unless you saw that it was. Trees growing in the prism mean the road is abandoned, not that its culverts were pulled."
},

"t": "h2",
"x": "6.4 Recording rules for road segments"
},
{
"t": "std",
"x": "**Pre-filled attributes.** These were pulled from Manulife\u2019s existing roads layer. Generally leave them as defaulted unless they are clearly wrong: if surface_material says rocked and the road is actually dirt, update it. Several fields also arrive pre-filled by default, such as Surface_Stability as Stable and Erosion_Control as No. Check each against the road and change only what is wrong. The only road fields that must be completed are FPA_Class and Road_Type."
},
{
"t": "std",
"x": "**Code** **the whole segment.** There is no easy way to break up a road segment in Field Maps, so if a segment has any issue, even on 10% of its length, code the whole segment as having that issue. One pirated spring makes FPA_Class Does not meet FPR even if the road looks great otherwise; one spot of cracking shoulder makes FPA_Class Does not meet FPR and Cut_Fillslope_Condition unstable. **Use the Road Notes point layer to record exactly where the isolated problem is.**"
},
{
"t": "std",
"x": "**Road** **Notes for changes in road type.** If the front half of a segment is active but it becomes undrivable, code the segment active and drop a Road Note point where it becomes undrivable, with an explanation: culvert washed out, brushed in, and so on. Same where a segment is only rocked for part of its length, or only ditched on the front end."
},
{
"t": "std",
"x": "**Adding roads.** You will find roads that are not in the roads layer. Add each one as a new segment in the road inventory layer and complete it like any other segment. Choose the green completed-inventory symbol when you create it, so Inventory_Completed fills in as Yes."
},
{
"t": "std",
"x": "**Limited Inventory.** Roads and structures marked Limited Inventory are not Manulife's responsibility: neighboring ownerships, and BLM controlled roads around Roseburg. Do not inventory them. Record a Limited Inventory pipe only if it has a significant issue that threatens a road we use."
},
{
"t": "std",
"x": "**Duplicate points.** Some areas, Corvallis in particular, have duplicate culvert points on one crossing. Inventory one and delete the duplicate."
},
{
"t": "std",
"x": "**Surface_Stability.** If the road does not meet FPR because of rilling, ruts or ponding, check unstable. Otherwise check stable. Cracked fills, slumps, and ditch and cutslope issues are captured elsewhere."
},
{
"t": "std",
"x": "**Ditch_Presence.** A ditch that is blocked or filled in is still a yes, with a note that it needs maintenance. A no means there is no ditch whatsoever, usually because the road is outsloped. Intermittent means a ditch along only part of the segment: drop a Road Note where it starts or stops."
},
{
"t": "std",
"x": "**Cut_Fillslope_Stability.** Check unstable if there are slumps, cracks, cutslope failures and the like."
},
{
"t": "std",
"x": "**Leave as defaulted.** Erosion_Control and Erosion_Control_Utilized: western Oregon is not using these. Construction_Year: filled in at the office if known. Travel_Speed: leave blank. Property: filled in by GIS."

const N = CHUNKS.length, AVG = CHUNKS.reduce((a, c) => a + c.len, 0) / N, DF = {};
CHUNKS.forEach(c => Object.keys(c.tf).forEach(t => DF[t] = (DF[t] || 0) + 1));
const idf = t => Math.log(1 + (N - (DF[t] || 0) + 0.5) / ((DF[t] || 0) + 0.5));

function search(q) {
  const qt = [...new Set(norm(q))];
  if (!qt.length) return { hits: [], terms: [] };
  const terms = qt.map(t => ({ t, alts: [...(GMAP[t] || [])] }));
  const scored = CHUNKS.map(c => {
    let s = 0, matched = 0;
    terms.forEach(({ t, alts }) => {
      let best = 0;
      const one = (w, wt) => { const f = c.tf[w]; if (!f) return 0; return wt * idf(w) * (f * 2.2) / (f + 1.2 * (0.25 + 0.75 * c.len / AVG)); };
      best = one(t, 1);
      alts.forEach(a => { best = Math.max(best, one(a, 0.6)); });
      if (c.title.has(t)) best += 0.8 * idf(t); else if (alts.some(a => c.title.has(a))) best += 0.4 * idf(t);
      if (best > 0) matched++;
      s += best;
    });
    if (!s) return null;
    s *= 0.6 + 0.4 * (matched / terms.length) * (matched / terms.length) + (matched === terms.length && terms.length > 1 ? 0.3 : 0);
    const raw = q.toLowerCase().trim();
    if (raw.split(/\s+/).length > 1 && c.low.includes(raw)) s *= 1.5;
    if (c.kind === 'std') s *= 1.15;
    return { c, s };
  }).filter(Boolean).sort((a, b) => b.s - a.s);
  const hl = new Set(); terms.forEach(({ t, alts }) => { hl.add(t); alts.forEach(a => hl.add(a)); });
  return { hits: scored, terms: [...hl] };
}
function highlight(s, terms) {
  const out = md(s);
  if (!terms || !terms.length) return out;
  // highlight whole words whose stem matches a search term
  return out.replace(/(<[^>]+>)|([A-Za-z0-9%][A-Za-z0-9%'’-]*)/g, (m, tag, w) => {
    if (tag) return tag;
    const n = norm(w); return n.length && n.some(x => terms.includes(x)) ? `<mark>${w}</mark>` : w;
  });
}

/* ---------- views ---------- */
const view = $('#view');
const tabs = [...document.querySelectorAll('nav.tabs button')];
let lastQuery = '';
function setTab(name) { tabs.forEach(b => b.setAttribute('aria-current', b.dataset.tab === name ? 'page' : 'false')); }
const QUICK = ['Can\'t reach the pipe', 'Which fields for a cross drain', 'Blocked ditch', 'Active channel width', 'Water bar', 'Add a new road', 'Limited Inventory', 'Duplicate points', 'Percent open', 'Pipe has holes in it', 'Pirated spring', 'Deep fill'];

function showAsk(q) {
  setTab('ask');
  q = (q || '').trim();
  const input = $('#q'); if (q && input.value !== q) input.value = q;
  if (!q) {
    view.innerHTML = `
      <section class="sec"><p class="eyebrow">Ask the guide</p>
      <h1>Type a question or a few words</h1>
      <p class="muted small">Answers come straight from the FRIA Field Guide, word for word. Try the quick questions below, or a walkthrough for the calls people get wrong.</p></section>
      <div class="chips">${QUICK.map(x => `<button class="chip" data-ask="${esc(x)}">${esc(x)}</button>`).join('')}</div>
      <section class="sec"><p class="eyebrow">Walkthroughs</p><div class="cards">${walkCards()}</div></section>
      ${foot()}`;
    return;
  }
  lastQuery = q;
  const { hits, terms } = search(q);
  const top = hits.slice(0, 8);
  const good = top.length && top[0].s > 1.2;
  let h = `<section class="sec"><p class="eyebrow">Results for</p><h1>${esc(q)}</h1></section>`;
  const sugg = suggestWalk(q);
  if (sugg) h += `<button class="card" data-walk="${sugg}"><b>Walk through it: ${esc(TREES[sugg].title)}</b><span>Answer a few questions and get the call.</span></button>`;
  if (!good) h += `<div class="empty"><b>No strong match.</b><p class="small muted">Search matches words, so try different ones (pipe, ditch, fill, status) or open the guide and browse.</p></div>`;
  h += top.map(({ c }) => `
    <article class="result">
      <div class="where">${c.kind === 'def' ? '<span class="tag def">Glossary</span>' : ''}
        <span>${esc(c.sec.title)}</span><button data-sec="${c.sec.id}">Open section</button></div>
      ${renderBlocks(c.blocks, terms)}
    </article>`).join('');
  h += foot();
  view.innerHTML = h;
}
function suggestWalk(q) {
  const t = new Set(norm(q));
  const has = (...w) => w.some(x => t.has(stem(x)));
  if (has('cirf','cmrpr','status','undetermined','unknown','imminent','ffc')) return 'status';
  if (has('connectivity','connected','disconnected','sag','scour')) return 'hydro';
  if (has('fpr','meet','fail')) return 'fpr';
  if (has('crossdrain','relief','spring')) return 'cross';
  return null;
}
function walkCards() { return Object.entries(TREES).map(([k, t]) => `<button class="card" data-walk="${k}"><b>${esc(t.title)}</b><span>${esc(t.blurb)}</span></button>`).join(''); }
function foot() { return `<footer class="note">Tarn Forestry LLC · FRIA Field Guide, ${esc(window.GUIDE_DATE || '')}. The guide governs. If this app and the guide ever differ, go by the printed guide and tell Tarn.</footer>`; }

let walk = null;
function showWalks() {
  setTab('walk');
  view.innerHTML = `<section class="sec"><p class="eyebrow">Walkthroughs</p><h1>Make the call step by step</h1>
    <p class="muted small">One question at a time. Each answer links back to the guide section it comes from.</p></section>
    <div class="cards">${walkCards()}</div>${foot()}`;
}
function startWalk(key) { walk = { key, node: TREES[key].start, trail: [], notes: [] }; renderWalk(); }
function renderWalk() {
  setTab('walk');
  const tree = TREES[walk.key], n = tree.nodes[walk.node];
  let h = `<div class="wk"><div class="row"><button class="back" data-walks>All walkthroughs</button>${walk.trail.length ? '<button class="back" data-wback>Back one step</button>' : ''}</div>
    <p class="eyebrow">${esc(tree.title)}</p>`;
  if (walk.trail.length) h += `<div class="trail">${walk.trail.map(s => `<span>${esc(s.a)}</span>`).join('')}</div>`;
  if (n.q) {
    h += `<div class="q"><h2>${esc(n.q)}</h2>${n.list ? `<ul>${n.list.map(x => `<li>${esc(x)}</li>`).join('')}</ul>` : ''}${n.help ? `<p class="small muted">${esc(n.help)}</p>` : ''}
      <div class="opts">${n.opts.map((o, i) => `<button class="opt" data-opt="${i}">${esc(o[0])}</button>`).join('')}</div></div>`;
  } else {
    const notes = walk.notes.concat(n.bullets || []);
    h += `<div class="answer ${n.tone}"><div class="code">${esc(n.code)}</div><p>${esc(n.text)}</p>${notes.length ? `<ul>${notes.map(x => `<li>${esc(x)}</li>`).join('')}</ul>` : ''}</div>
      <div class="row">${(n.refs || []).map(r => { const s = secByPrefix(r); return s ? `<button class="back" data-sec="${s.id}">Guide: ${esc(s.title)}</button>` : ''; }).join('')}
      <button class="back" data-walk="${walk.key}">Start over</button></div>`;
  }
  h += '</div>';
  view.innerHTML = h; window.scrollTo(0, 0);
}
function pickOpt(i) {
  const n = TREES[walk.key].nodes[walk.node], o = n.opts[i];
  if (o[1].startsWith('@')) { startWalk(o[1].slice(1)); return; }
  walk.trail.push({ node: walk.node, a: o[0], note: o[2] });
  if (o[2]) walk.notes.push(o[2]);
  walk.node = o[1]; renderWalk();
}
function walkBack() {
  const s = walk.trail.pop(); if (!s) return;
  if (s.note) walk.notes.pop();
  walk.node = s.node; renderWalk();
}

function showCard() {
  setTab('card');
  const t41 = (SECS.find(s => s.title.startsWith('4.1')) || { blocks: [] }).blocks.find(b => b.t === 'table');
  const req = CHUNKS.filter(c => /Culvert status in the field|Stream class at the crossing|Fish streams only|Embedment measurement|Pre-filled attributes|Limited Inventory|Leave as defaulted/.test(c.text));
  view.innerHTML = `<section class="sec"><p class="eyebrow">Field card</p><h1>What to fill in at a crossing</h1></section>
    ${t41 ? tableHTML(t41.rows) : ''}
    <section class="sec"><h2>Quick rules</h2>${req.map(c => renderBlocks(c.blocks)).join('')}</section>${foot()}`;
}

function showGuide() {
  setTab('guide');
  view.innerHTML = `<section class="sec"><p class="eyebrow">The guide</p><h1>FRIA Field Guide</h1></section>
    <div class="toc">${SECS.map(s => `<button class="${s.lvl === 2 ? 'sub' : ''}" data-sec="${s.id}"><span>${esc(s.title)}</span></button>`).join('')}</div>${foot()}`;
}
function showSec(id) {
  setTab('guide');
  const i = SECS.findIndex(s => s.id === id); const s = SECS[i]; if (!s) return showGuide();
  const subs = s.lvl === 1 ? SECS.filter(x => x.parent === s) : [];
  const prev = SECS[i - 1], next = SECS[i + 1];
  view.innerHTML = `<div class="row">${lastQuery ? `<button class="back" data-ask="${esc(lastQuery)}">Back to results</button>` : ''}<button class="back" data-guide>Contents</button></div>
    <section class="sec">${s.parent ? `<p class="eyebrow">${esc(s.parent.title)}</p>` : ''}<h1>${esc(s.title)}</h1>${renderBlocks(s.blocks)}</section>
    ${subs.length ? `<div class="toc">${subs.map(x => `<button class="sub" data-sec="${x.id}"><span>${esc(x.title)}</span></button>`).join('')}</div>` : ''}
    <div class="row">${prev ? `<button class="back" data-sec="${prev.id}">Previous: ${esc(prev.title)}</button>` : ''}${next ? `<button class="back" data-sec="${next.id}">Next: ${esc(next.title)}</button>` : ''}</div>${foot()}`;
  window.scrollTo(0, 0);
}

/* ---------- routing ---------- */
function route() {
  const h = (location.hash || '').slice(1);
  if (h.startsWith('walk-') && TREES[h.slice(5)]) startWalk(h.slice(5));
  else if (h === 'walk') showWalks();
  else if (h === 'card') showCard();
  else if (h === 'guide') showGuide();
  else if (/^s\d+$/.test(h)) showSec(h);
  else showAsk(lastQuery);
}
function go(hash) { if (location.hash === '#' + hash) route(); else location.hash = hash; }

document.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.tab) { const m = { ask: '', walk: 'walk', card: 'card', guide: 'guide' }[b.dataset.tab]; if (b.dataset.tab === 'ask') { lastQuery = ''; $('#q').value = ''; } go(m || 'ask'); return; }
  if (b.dataset.ask !== undefined) { $('#q').value = b.dataset.ask; showAsk(b.dataset.ask); window.scrollTo(0, 0); return; }
  if (b.dataset.walk) { go('walk-' + b.dataset.walk); if (location.hash === '#walk-' + b.dataset.walk) startWalk(b.dataset.walk); return; }
  if (b.dataset.walks !== undefined) { go('walk'); return; }
  if (b.dataset.wback !== undefined) { walkBack(); return; }
  if (b.dataset.opt !== undefined) { pickOpt(+b.dataset.opt); return; }
  if (b.dataset.sec) { go(b.dataset.sec); return; }
  if (b.dataset.guide !== undefined) { go('guide'); return; }
  if (b.dataset.zoom) { openZoom(b.dataset.zoom); return; }
});
$('#search').addEventListener('submit', e => { e.preventDefault(); const q = $('#q').value; $('#q').blur(); if (location.hash && location.hash !== '#ask') { history.replaceState(null, '', location.pathname + location.search); } showAsk(q); window.scrollTo(0, 0); });
window.addEventListener('hashchange', route);

function openZoom(src) {
  const z = document.createElement('div'); z.className = 'zoom';
  z.innerHTML = `<div class="bar"><button data-zbig>Zoom</button><button data-zclose>Close</button></div><img src="${esc(src)}" alt="Guide figure, full size">`;
  z.addEventListener('click', ev => { const t = ev.target.closest('button'); if (!t) return; ev.stopPropagation(); if (t.dataset.zclose !== undefined) z.remove(); else { z.classList.toggle('big'); t.textContent = z.classList.contains('big') ? 'Fit' : 'Zoom'; } });
  document.body.appendChild(z);
}

/* ---------- offline status ---------- */
const st = $('#status');
function setStatus() { if (!st) return; st.textContent = navigator.onLine ? (window.OFFLINE_READY ? 'Saved for offline' : 'Online') : 'Offline'; }
window.addEventListener('online', setStatus); window.addEventListener('offline', setStatus);
window.setOfflineReady = () => { window.OFFLINE_READY = true; setStatus(); };
setStatus();
route();
})();
